name: Update Skills Table

on:
  push:
    branches: [main]
    paths:
      - 'snowflake-skills/*/SKILL.md'
      - 'general-skills/*/SKILL.md'
      - '.github/scripts/generate-skills-table.sh'
      - '.github/scripts/sync-agent-rules.sh'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate skills table
        run: .github/scripts/generate-skills-table.sh

      - name: Sync agent rules
        run: .github/scripts/sync-agent-rules.sh

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Sync skills table and agent rules [skip ci]"
          title: "Auto: Sync skills table and agent rules"
          body: |
            Automated update triggered by a SKILL.md change on `main`.

            - Regenerated skills tables in `snowflake-skills/README.md` and `general-skills/README.md`
            - Synced agent rule files (`.cursor/`, `.windsurf/`, `.claude/`, `.gemini/`)
          branch: auto/sync-skills-table
          delete-branch: true
          labels: automated
