name: Skill Freshness Check

on:
  schedule:
    - cron: '23 15 * * *'  # Daily ~8:23am PT (15:23 UTC)
  workflow_dispatch:        # Manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-freshness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Restore doc hashes cache
        uses: actions/cache/restore@v5
        id: cache-restore
        with:
          path: snowflake-skills/.doc-hashes.json
          key: doc-hashes-${{ github.run_id }}
          restore-keys: doc-hashes-

      - name: Run freshness checker
        id: check
        run: python .github/scripts/check-skill-freshness.py

      - name: Save doc hashes cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: snowflake-skills/.doc-hashes.json
          key: doc-hashes-${{ github.run_id }}

      - name: Create issue if stale skills detected
        if: steps.check.outputs.has_stale == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const bodyPath = '${{ steps.check.outputs.issue_body_path }}';
            let body = 'Skill freshness check detected changes. See workflow run for details.';
            if (bodyPath && fs.existsSync(bodyPath)) {
              body = fs.readFileSync(bodyPath, 'utf8');
            }

            // Check for existing open issue
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'skill-freshness',
              state: 'open',
            });

            if (existing.data.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: body,
              });
              console.log(`Updated existing issue #${existing.data[0].number}`);
            } else {
              // Create new issue
              const staleSkills = JSON.parse('${{ steps.check.outputs.stale_skills }}' || '[]');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Skill freshness: ${staleSkills.length} skill(s) may need updating`,
                body: body,
                labels: ['skill-freshness'],
              });
              console.log('Created new freshness issue');
            }

      - name: Notify Slack
        if: steps.check.outputs.has_stale == 'true' && vars.SLACK_FRESHNESS_WEBHOOK != ''
        continue-on-error: true
        run: |
          STALE='${{ steps.check.outputs.stale_skills }}'
          COUNT=$(echo "$STALE" | jq length)
          curl -s -X POST "${{ vars.SLACK_FRESHNESS_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🔔 Skill freshness: ${COUNT} skill(s) may need updating.\nSkills: ${STALE}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
